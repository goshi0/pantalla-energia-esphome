            "..opppo.....o..oo..o....opppo..."
            "..oppppo...opooppoopo..oppppo..."
            "...oppppo.opppoppoppo.oppppo...."
            "...opppppooppppppppppopppppo...."
            "...opppppppppppppppppppppppo...."
            "....opphhhhpppppppppppppppo....."
            "....ophhhhhhppppppppppppppo....."
            "....oppphhppppppppppppppppo....."
            "....opprrppppppppppppprrppo....."
            "...oopprrrrppppppppprrrrppoo...."
            ".ooppppprrrrrrppprrrrrrpppopoo.."
            "oppppppprrrkkrppprkkrrrpppppddo."
            "opppppppprrkkrppprkkrrpppppdddo."
            ".ooppppwppppprppprpppppwppdddo.."
            "...opppwwpppppppppppppwwpddoo..."
            "..oopppwwwgpppppppppwgwwdddooo.."
            ".opppppwwwgwwgwwwwgwwgwwddddddo."
            "opppppppgggggggtttgggggddddddddo"
            "opppppppppgwwgtttttwwddddddddddo"
            ".oppppppppppwttttttddddddoddddo."
            "..ooooopppppppppppddddddo.oooo.."
            ".......ooppppppppdddddoo........"
            ".......oppppppppdddddddo........"
            "......oddddddoodooddddddo......."
            "......oddddddo.o.oddddddo......."
            ".......oddddo.....oddddo........"
            "........oooo.......oooo........."
            "................................"
          };
          static const int BOB[] = {0, -1, -2, -3, -4, -4, -3, -2, -1, 0, 0, 0};
          static int shown = -1;
          lv_obj_t *c = id(gengar_canvas);
          int t = id(g_gengar_step)++;
          int f = t % 27 == 26 ? 1 : (t % 64 >= 50 && t % 64 < 57 ? 2 : 0);
          if (f != shown) {
            shown = f;
            lv_draw_buf_t *buf = lv_canvas_get_draw_buf(c);
            for (int y = 0; y < 32; y++)
              for (int x = 0; x < 32; x++) {
                uint32_t col;
                switch (FRAMES[f][y * 32 + x]) {
                  case 'o': col = 0x1A0E28; break; // outline
                  case 'p': col = ${col_gengar}; break; // body
                  case 'd': col = 0x583C80; break; // shade
                  case 'h': col = 0xA888CE; break; // highlight
                  case 'r': col = 0xFF3050; break; // eye
                  case 'k': col = 0x6E0014; break; // pupil
                  case 'w': col = 0xFFFFFF; break; // teeth
                  case 'g': col = 0xAAAABE; break; // gaps between the teeth
                  case 't': col = 0xFF6E96; break; // tongue
                  default: col = 0x000000;
                }
                // each sprite pixel is a 3x3 block (LVGL can't scale an RGB565 canvas)
                uint16_t px = lv_color_to_u16(lv_color_hex(col));
                for (int dy = 0; dy < 3; dy++) {
                  uint16_t *row = (uint16_t *) (buf->data + (y * 3 + dy) * buf->header.stride);
                  row[x * 3] = row[x * 3 + 1] = row[x * 3 + 2] = px;
                }
              }
            lv_obj_invalidate(c);
          }
          lv_obj_set_y(c, -42 + 2 * BOB[t % 12]);
      - if:
          condition:
            lambda: return id(g_gengar_step) % ${gengar_tip_steps} == 1;
          then:
            - script.execute: gengar_tip

  - id: gengar_tip
    then:
      - lvgl.label.update:
          id: gengar_tip_text
          text: !lambda |-
            static const char *const TIPS[] = {
            "Apaga la luz al salir... ¡la oscuridad es mía!",
            "El standby chupa energía. Yo solo chupo sombras.",
            "Lavadora llena y en hora barata. ¡Ji ji ji!",
            "Nevera abierta: el frío se escapa... como yo.",
            "Tapa la olla: hierve antes y gastas menos.",
            "¿Horno encendido 20 min antes? ¡Ni yo espero tanto!",
            "Cargador enchufado sin móvil = vampiro de energía.",
            "Un grado menos de calefacción, un susto menos en la factura.",
            "Los fantasmas no pagamos la luz. Tú sí. ¡Ji ji!",
            "Te estoy mirando desde detrás de la pantalla...",
            "Si oyes un ruido raro, era yo. Apaga la tele.",
            "Lavavajillas en modo eco: tarda más, gasta menos.",
            "Ropa con agua fría. El calor, para mis travesuras.",
            "Baja las persianas al anochecer y guarda el calor.",
            };
            const int N = sizeof(TIPS) / sizeof(TIPS[0]);
            int i = id(g_tip)++;
            // every third tip reacts to what is happening right now
            if (i % 3 == 0) {
              float w = id(power_w).state, r = id(price_ratio).state;
              if (w >= ${power_amber_max_w}) return std::string("¡Cuánto gastas! Hasta a mí me da miedo.");
              if (r < 0.34f) return std::string("¡Luz barata ahora! Pon la lavadora, ji ji.");
              if (r >= 0.67f) return std::string("¡Luz cara! Deja el horno para luego o te asusto.");
            }
            return std::string(TIPS[(i - i / 3) % N]);

  - id: refresh_power
    then:
      - if: # near the limit: wake the screen and jump to the power page
          condition:
            lambda: |-
              float w = id(power_w).state;
              bool was = id(g_alert);
              if (std::isnan(w) || w < ${power_alert_off_w}) id(g_alert) = false;
              else if (w >= ${power_alert_on_w}) id(g_alert) = true;
              return id(g_alert) && !was;
          then:
            - light.turn_on:
                id: back_light
            - lvgl.resume
            - lvgl.page.show: main_page
      - lvgl.arc.update:
          id: power_arc
          value: !lambda |-
            float w = id(power_w).state;
            if (std::isnan(w) || w < 0) return 0;
            return (int) std::min(w, (float) ${power_gauge_max_w});
          indicator:
            arc_color: !lambda |-
              float w = id(power_w).state;
              if (w < ${power_green_max_w}) return lv_color_hex(${col_green});
              if (w < ${power_amber_max_w}) return lv_color_hex(${col_amber});
              return lv_color_hex(${col_red});
      - lvgl.label.update:
          id: power_value
          text: !lambda |-
            char buf[12];
            float w = id(power_w).state;
            if (std::isnan(w)) snprintf(buf, sizeof(buf), "--");
            else if (w < 1000) snprintf(buf, sizeof(buf), "%.0f", w);
            else snprintf(buf, sizeof(buf), "%.2f", w / 1000);
            for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
            return std::string(buf);
          text_color: !lambda |-
            return lv_color_hex(id(g_alert) ? ${col_red} : 0xFFFFFF);
      - lvgl.label.update:
          id: power_unit
          text: !lambda |-
            return std::string(id(power_w).state >= 1000 ? "kW" : "W");
      - lvgl.image.update:
          id: power_icon
          image_recolor: !lambda |-
            float w = id(power_w).state;
            if (w < ${power_green_max_w}) return lv_color_hex(${col_green});
            if (w < ${power_amber_max_w}) return lv_color_hex(${col_amber});
            return lv_color_hex(${col_red});

  - id: refresh_price
    then:
      - lvgl.label.update:
          id: price_text
          text: !lambda |-
            char buf[20];
            float p = id(price_eur).state;
            if (std::isnan(p)) snprintf(buf, sizeof(buf), "-- €/kWh");
            else snprintf(buf, sizeof(buf), "%.3f €/kWh", p);
            for (char *c = buf; *c; c++) if (*c == '.') *c = ',';
            return std::string(buf);
          text_color: !lambda |-
            float r = id(price_ratio).state;
            if (std::isnan(r)) return lv_color_hex(${col_muted});
            if (r < 0.34f) return lv_color_hex(${col_green});
            if (r < 0.67f) return lv_color_hex(${col_amber});
            return lv_color_hex(${col_red});

  - id: refresh_energy
    then:
      - lambda: |-
          // Derive today's / this month's kWh and cost from the lifetime meter reading.
          float e = id(energy_total).state;
          if (std::isnan(e) || e <= 0) return;
          float d = e - id(g_last_kwh);
          if (d < -0.01f) {
            // The meter counter went backwards (reset): shift the baselines with it
            id(g_day_start_kwh) += d;
            id(g_month_start_kwh) += d;
          } else if (d > 0) {
            float p = id(price_eur).state;
            if (!std::isnan(p)) {
              id(g_day_cost) += d * p;
              id(g_month_cost) += d * p;
            }
          }
          id(g_last_kwh) = e;
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            if (now.month != id(g_month)) {
              id(g_month) = now.month;
              id(g_month_start_kwh) = e;
              id(g_month_cost) = 0;
            }
            if (now.day_of_month != id(g_day)) {
              id(g_day) = now.day_of_month;
              id(g_day_start_kwh) = e;
              id(g_day_cost) = 0;
            }
          }
      - lvgl.label.update:
          id: day_kwh_text
          text: !lambda |-
            char buf[12];
            float e = id(energy_total).state;
            float v = e - id(g_day_start_kwh);
            if (std::isnan(e) || e <= 0) snprintf(buf, sizeof(buf), "--");
            else snprintf(buf, sizeof(buf), v < 100 ? "%.1f" : "%.0f", v);
            for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
            return std::string(buf);
      - lvgl.label.update:
          id: day_cost_text
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.2f €", id(g_day_cost));
            for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
            return std::string(buf);
      - lvgl.label.update:
          id: month_kwh_text
          text: !lambda |-
            char buf[12];
            float e = id(energy_total).state;
            float v = e - id(g_month_start_kwh);
            if (std::isnan(e) || e <= 0) snprintf(buf, sizeof(buf), "--");
            else snprintf(buf, sizeof(buf), v < 1000 ? "%.1f" : "%.0f", v);
            for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
            return std::string(buf);
      - lvgl.label.update:
          id: month_cost_text
          text: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.2f €", id(g_month_cost));
            for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
            return std::string(buf);

