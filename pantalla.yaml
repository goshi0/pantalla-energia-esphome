  style_definitions:
    - id: st_page
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    - id: st_dot # page indicator dot
      width: 8
      height: 8
      radius: 4
      border_width: 0
      bg_opa: COVER
      bg_color: ${col_dot_off}
      align: CENTER
      y: 100
    - id: st_ring # thin coloured ring around the day / month pages
      width: 236
