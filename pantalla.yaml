substitutions:
  name: "esphome-ams-display"
  friendly_name: "AMS-meter hvit"

  # Live power gauge (watts)
  power_green_max_w: "1800" # green below this
  power_amber_max_w: "3600" # amber below this, red above
  power_gauge_max_w: "5500" # full scale of the gauge (contracted power)
  power_alert_on_w: "5000" # start flashing red at this power...
  power_alert_off_w: "4800" # ...and stop once back below this

  # Touch and orientation
  swipe_min_px: "50" # a vertical drag at least this long flips the screen
  madctl_color: "0x08" # colour-order bit of the panel (GC9A01A = BGR)

  # Rooms page columns (pixels from the left / right edge)
  rooms_name_x: "20"
  rooms_temp_x: "-64"
  rooms_hum_x: "-20"

  # Temperature graph
  graph_sample_min: "10" # minutes between samples
  graph_points: "144" # samples kept (144 x 10 min = 24 h)

  # Palette
  col_track: "0x1E2226"
  col_muted: "0x8A9199"
  col_green: "0x2EE67A"
  col_amber: "0xFFB020"
  col_red: "0xFF4D4D"
  col_day: "0x38BDF8"
  col_month: "0xA78BFA"
  col_rooms: "0xF472B6"
  col_cocina: "0xFFB020"
  col_habitacion: "0xA78BFA"
  col_comedor: "0x38BDF8"
  col_entrada: "0x2EE67A"
  col_dot_off: "0x3A4046"
  col_gengar: "0x7E5CAA"

  # Gengar page
  gengar_frame_ms: "150ms" # animation step
  gengar_tip_steps: "47" # steps between tips (47 x 150 ms = 7 s)

  # First-boot seeds, taken from Home Assistant statistics on 2026-10-10.
  # They are only used until the device has stored its own values in flash;
  # after that the day/month counters maintain themselves.
  seed_day: "10"
  seed_month: "10"
  seed_day_start_kwh: "9302.2465" # meter reading at 00:00 today
  seed_month_start_kwh: "9173.2562" # meter reading at 00:00 on the 1st
  seed_last_kwh: "9316.0646" # meter reading the cost seeds are valid for
  seed_day_cost: "1.625"
  seed_month_cost: "28.63"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: -100 # after the display is up: restore the saved orientation
    then:
      - if:
          condition:
            lambda: return id(g_flipped);
          then:
            - script.execute: apply_orientation

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none # modem sleep made the link to Home Assistant drop every few minutes

# Reset reason of the last boot (diagnostics)
debug:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

# The day/month counters live in flash; don't write them more often than needed
preferences:
  flash_write_interval: 10min

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO7

output:
  - platform: ledc
    pin:
      number: GPIO3
    id: backlight_output

light:
  - platform: monochromatic
    output: backlight_output
    name: LCD Backlight
    id: back_light
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      then:
        lvgl.pause
    on_turn_on:
      then:
        lvgl.resume

display:
  - platform: ili9xxx
    invert_colors: true
    id: lcd_display
    model: gc9a01a
    data_rate: 80MHz
    cs_pin: GPIO10
    dc_pin: GPIO2
    dimensions:
      width: 240
      height: 240
    update_interval: never
    auto_clear_enabled: false
    transform: # Configure to use it upside down. Remove transform-element to rotate 180
      mirror_x: false
      mirror_y: true

i2c:
  sda: 4
  scl: 5
  id: i2c_touch

touchscreen:
  platform: cst816
  id: my_touchscreen
  interrupt_pin: 0
  reset_pin: 1
  on_touch:
    then:
      - lambda: |-
          id(g_touch_x0) = id(g_touch_x1) = touch.x;
          id(g_touch_y0) = id(g_touch_y1) = touch.y;
          id(g_touch_woke) = false;
      - if: # If the LCD is switched off (controllable from the HASS-device), turn on display on first touch
          condition:
            or:
              - lvgl.is_paused
              - light.is_off: back_light
          then:
            - lambda: id(g_touch_woke) = true;
            - lvgl.resume
            - lvgl.page.show: main_page
            - light.turn_on:
                id: back_light
  on_update:
    then:
      - lambda: |-
          if (!touches.empty()) {
            id(g_touch_x1) = touches[0].x;
            id(g_touch_y1) = touches[0].y;
          }
  on_release:
    then:
      - if:
          condition:
            lambda: return !id(g_touch_woke);
          then:
            - if: # a vertical drag turns the screen upside down, a tap shows the next page
                condition:
                  lambda: |-
                    int dx = abs(id(g_touch_x1) - id(g_touch_x0));
                    int dy = abs(id(g_touch_y1) - id(g_touch_y0));
                    return dy >= ${swipe_min_px} && dy > dx;
                then:
                  - script.execute: flip_screen
                else:
                  - lvgl.page.next

# ---- UI ----

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: g_alert # true while the power is near the limit
    type: bool
    initial_value: "false"
  - id: g_alert_lit # current phase of the red flash
    type: bool
    initial_value: "false"
  - id: g_flipped # screen turned 180 degrees by a vertical drag
    type: bool
    restore_value: true
    initial_value: "false"
  - id: g_touch_x0 # where the current touch started...
    type: int
    initial_value: "0"
  - id: g_touch_y0
    type: int
    initial_value: "0"
  - id: g_touch_x1 # ...and where it is now
    type: int
    initial_value: "0"
  - id: g_touch_y1
    type: int
    initial_value: "0"
  - id: g_touch_woke # this touch only woke the screen up
    type: bool
    initial_value: "false"
  - id: g_graph_lo # temperature at the bottom of the graph
    type: int
    initial_value: "0"
  - id: g_graph_hi # ...and at the top
    type: int
    initial_value: "0"
  - id: g_graph_span_min # minutes of history on the graph
    type: int
    initial_value: "0"
  - id: g_gengar_step # animation step of the Gengar page
    type: int
    initial_value: "0"
  - id: g_tip # next tip to show on the Gengar page
    type: int
    initial_value: "0"
  - id: g_day # day of month the daily counters belong to
    type: int
    restore_value: true
    initial_value: "${seed_day}"
  - id: g_month # month the monthly counters belong to
    type: int
    restore_value: true
    initial_value: "${seed_month}"
  - id: g_day_start_kwh
    type: float
    restore_value: true
    initial_value: "${seed_day_start_kwh}"
  - id: g_month_start_kwh
    type: float
    restore_value: true
    initial_value: "${seed_month_start_kwh}"
  - id: g_last_kwh # last meter reading already accounted for in the costs
    type: float
    restore_value: true
    initial_value: "${seed_last_kwh}"
  - id: g_day_cost
    type: float
    restore_value: true
    initial_value: "${seed_day_cost}"
  - id: g_month_cost
    type: float
    restore_value: true
    initial_value: "${seed_month_cost}"

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
  - platform: wifi_info
    bssid:
      name: WiFi BSSID

sensor:
  # Diagnostics: link quality and time since the last reboot
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 30s
  - platform: uptime
    name: Uptime
    update_interval: 30s

  - platform: homeassistant
    id: power_w
    entity_id: sensor.shellyem_c45bbe797a7b_channel_2_power
    internal: true
    filters:
      - or:
          - delta: 25 # redraw at once on a real change...
          - throttle: 5s # ...otherwise at most every 5 s
    on_value:
      then:
        - script.execute: refresh_power

  - platform: homeassistant
    id: energy_total # lifetime meter reading in kWh
    entity_id: sensor.shellyem_c45bbe797a7b_channel_2_energy
    internal: true
    filters:
      - throttle: 15s
    on_value:
      then:
        - script.execute: refresh_energy

  - platform: homeassistant
    id: price_eur # current PVPC price in EUR/kWh
    entity_id: sensor.esios_pvpc
    internal: true
    on_value:
      then:
        - script.execute: refresh_price

  - platform: homeassistant
    id: price_ratio # 0 = cheapest hour of the day, 1 = most expensive
    entity_id: sensor.esios_pvpc
    attribute: price_ratio
    internal: true
    on_value:
      then:
        - script.execute: refresh_price

  # Rooms page: temperature and humidity of every room
  - platform: homeassistant
    id: cocina_temp
    entity_id: sensor.cocina_temperatura_2
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: cocina_temp_text
            text: !lambda |-
              char buf[12];
              if (std::isnan(x)) snprintf(buf, sizeof(buf), "--");
              else snprintf(buf, sizeof(buf), "%.1f°", x);
              for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
              return std::string(buf);

  - platform: homeassistant
    id: cocina_hum
    entity_id: sensor.cocina_humidity
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: cocina_hum_text
            text: !lambda |-
              char buf[12];
              if (std::isnan(x)) snprintf(buf, sizeof(buf), "--");
              else snprintf(buf, sizeof(buf), "%.0f%%", x);
              return std::string(buf);

  - platform: homeassistant
    id: habitacion_temp
    entity_id: sensor.temperatura_habitacion_temperatura
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: habitacion_temp_text
            text: !lambda |-
              char buf[12];
              if (std::isnan(x)) snprintf(buf, sizeof(buf), "--");
              else snprintf(buf, sizeof(buf), "%.1f°", x);
              for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
              return std::string(buf);

  - platform: homeassistant
    id: habitacion_hum
    entity_id: sensor.temperatura_habitacion_humedad
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: habitacion_hum_text
            text: !lambda |-
              char buf[12];
              if (std::isnan(x)) snprintf(buf, sizeof(buf), "--");
              else snprintf(buf, sizeof(buf), "%.0f%%", x);
              return std::string(buf);

  - platform: homeassistant
    id: comedor_temp
    entity_id: sensor.temperatura_comedor_temperatura
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: comedor_temp_text
            text: !lambda |-
              char buf[12];
              if (std::isnan(x)) snprintf(buf, sizeof(buf), "--");
              else snprintf(buf, sizeof(buf), "%.1f°", x);
              for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
              return std::string(buf);

  - platform: homeassistant
    id: comedor_hum
    entity_id: sensor.temperatura_comedor_humedad
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: comedor_hum_text
            text: !lambda |-
              char buf[12];
              if (std::isnan(x)) snprintf(buf, sizeof(buf), "--");
              else snprintf(buf, sizeof(buf), "%.0f%%", x);
              return std::string(buf);

  - platform: homeassistant
    id: entrada_temp
    entity_id: sensor.lumi_lumi_weather_temperature
    internal: true
    on_value:
      then:
        - lvgl.label.update:
            id: entrada_temp_text
            text: !lambda |-
              char buf[12];
              if (std::isnan(x)) snprintf(buf, sizeof(buf), "--");
              else snprintf(buf, sizeof(buf), "%.1f°", x);
              for (char *p = buf; *p; p++) if (*p == '.') *p = ',';
