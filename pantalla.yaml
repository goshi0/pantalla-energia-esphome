        - lvgl.label.update:
            id: entrada_hum_text
            text: !lambda |-
              char buf[12];
              if (std::isnan(x)) snprintf(buf, sizeof(buf), "--");
              else snprintf(buf, sizeof(buf), "%.0f%%", x);
              return std::string(buf);

interval:
  - interval: 1min # keeps the day/month rollover on time even with no consumption
    then:
      - script.execute: refresh_energy
      - script.execute: refresh_graph
      - lambda: |-
          // Preventive restart every 48 h (it froze once and only came back by unplugging it)
          if (millis() > 48UL * 3600UL * 1000UL) App.safe_reboot();
  - interval: ${gengar_frame_ms} # Gengar animation, only while its page is shown
    then:
      - if:
          condition:
            lambda: return lv_screen_active() == id(gengar_page)->obj;
          then:
            - script.execute: gengar_step
  - interval: 400ms # red flash while the power is near the limit
    then:
      - if:
          condition:
            lambda: return id(g_alert);
          then:
            - lambda: id(g_alert_lit) = !id(g_alert_lit);
            - if:
                condition:
                  lambda: return id(g_alert_lit);
                then:
                  - lvgl.widget.show: alert_overlay
                else:
                  - lvgl.widget.hide: alert_overlay
          else:
            - if:
                condition:
                  lambda: return id(g_alert_lit);
                then:
                  - lambda: id(g_alert_lit) = false;
                  - lvgl.widget.hide: alert_overlay

script:
  - id: flip_screen
    then:
      - lambda: |-
          id(g_flipped) = !id(g_flipped);
          global_preferences->sync(); // keep the orientation even if unplugged right away
      - script.execute: apply_orientation

  - id: apply_orientation
    then:
      - lambda: |-
          // Rewrite the panel's scan direction (MADCTL): normal = mirror Y, flipped = mirror X
          id(lcd_display).command(0x36);
          id(lcd_display).data(${madctl_color} | (id(g_flipped) ? 0x40 : 0x80));
      - lvgl.widget.redraw:

  - id: refresh_graph
    then:
      - lambda: |-
          // Temperature history of every room, kept in RAM (it starts again after a reboot)
          const int N = ${graph_points}, ROOMS = 4;
          const int X0 = 58, X1 = 212, Y0 = 74, Y1 = 166; // plot area in screen pixels
          static float hist[ROOMS][N];
          static lv_point_precise_t pts[ROOMS][N];
          static int n = 0;
          static uint32_t last_ms = 0;
          float cur[ROOMS] = {id(cocina_temp).state, id(habitacion_temp).state,
                              id(comedor_temp).state, id(entrada_temp).state};
          lv_obj_t *lines[ROOMS] = {id(cocina_line)->obj, id(habitacion_line)->obj,
                                    id(comedor_line)->obj, id(entrada_line)->obj};
          bool any = false;
          for (float v : cur) any = any || !std::isnan(v);
          if (!any) return;
          uint32_t now_ms = millis();
          if (n > 0 && now_ms - last_ms < ${graph_sample_min} * 60000UL) return;
          last_ms = now_ms;
          if (n == N) { // full: drop the oldest sample
            for (int r = 0; r < ROOMS; r++) memmove(hist[r], hist[r] + 1, (N - 1) * sizeof(float));
            n--;
          }
          for (int r = 0; r < ROOMS; r++) // a room without a reading keeps its last value
            hist[r][n] = (std::isnan(cur[r]) && n > 0) ? hist[r][n - 1] : cur[r];
          n++;

          float lo = NAN, hi = NAN;
          for (int r = 0; r < ROOMS; r++)
            for (int i = 0; i < n; i++) {
              float v = hist[r][i];
              if (std::isnan(v)) continue;
              if (std::isnan(lo) || v < lo) lo = v;
              if (std::isnan(hi) || v > hi) hi = v;
            }
          int ilo = (int) floorf(lo), ihi = (int) ceilf(hi);
          if (ihi - ilo < 2) { ihi++; if (ihi - ilo < 2) ilo--; }
          id(g_graph_lo) = ilo;
          id(g_graph_hi) = ihi;
          id(g_graph_span_min) = (n - 1) * ${graph_sample_min};

          int count = n < 2 ? 2 : n; // a single sample is drawn as a flat line
          for (int r = 0; r < ROOMS; r++) {
            float first = NAN;
            for (int i = 0; i < n && std::isnan(first); i++) first = hist[r][i];
            if (std::isnan(first)) { lv_line_set_points(lines[r], pts[r], 0); continue; }
            for (int i = 0; i < count; i++) {
              float v = hist[r][i < n ? i : n - 1];
              if (std::isnan(v)) v = first;
              pts[r][i].x = X0 + (X1 - X0) * i / (count - 1);
              pts[r][i].y = Y1 - (int) lroundf((v - ilo) * (Y1 - Y0) / (ihi - ilo));
            }
            lv_line_set_points(lines[r], pts[r], count);
          }
      - lvgl.label.update:
          id: graph_hi_text
          text: !lambda |-
            return std::to_string(id(g_graph_hi)) + "°";
      - lvgl.label.update:
          id: graph_lo_text
          text: !lambda |-
            return std::to_string(id(g_graph_lo)) + "°";
      - lvgl.label.update:
          id: graph_title
          text: !lambda |-
            int m = id(g_graph_span_min);
            if (m < 60) return std::string("TEMP AHORA");
            return "TEMP " + std::to_string(m / 60) + " H";

  - id: gengar_step
    then:
      - lambda: |-
          // 32x32 pixel-art Gengar drawn 3x bigger on a canvas; it floats up and down,
          // blinks every few seconds and now and then sticks its tongue out
          static const char *const FRAMES[3] = { // one 32x32 map per frame
            // open
            "................................"
            "................................"
            "...o.......................o...."
            "..opoo...................oopo..."
            "..opppo.....o..oo..o....opppo..."
            "..oppppo...opooppoopo..oppppo..."
            "...oppppo.opppoppoppo.oppppo...."
            "...opppppooppppppppppopppppo...."
            "...opppppppppppppppppppppppo...."
            "....opphhhhpppppppppppppppo....."
            "....ophhhhhhppppppppppppppo....."
            "....oppphhppppppppppppppppo....."
            "....opprrppppppppppppprrppo....."
            "...oopprrrrppppppppprrrrppoo...."
            ".ooppppprrrrrrppprrrrrrpppopoo.."
            "oppppppprrrkkrppprkkrrrpppppddo."
            "opppppppprrkkrppprkkrrpppppdddo."
            ".ooppppwppppprppprpppppwppdddo.."
            "...opppwwpppppppppppppwwpddoo..."
            "..oopppwwwgpppppppppwgwwdddooo.."
            ".opppppwwwgwwgwwwwgwwgwwddddddo."
            "opppppppgggggggggggggggddddddddo"
            "opppppppppgwwgwwwwgwwddddddddddo"
            ".oppppppppppwgwwwwgddddddoddddo."
            "..ooooopppppppppppddddddo.oooo.."
            ".......ooppppppppdddddoo........"
            ".......oppppppppdddddddo........"
            "......oddddddoodooddddddo......."
            "......oddddddo.o.oddddddo......."
